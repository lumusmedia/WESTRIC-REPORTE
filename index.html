<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Westric · Reportes de Performance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: barra fija con marca + pestañas por período; el reporte ocupa el resto de la pantalla */
:root{
  --navy:#002B5B; --cyan:#0091CC; --bar-fg:#FFFFFF; --bar-muted:rgba(255,255,255,.6);
  --tab-active:#FFFFFF; --tab-active-fg:#002B5B; --bg:#FFFFFF;
  --display:'Barlow Condensed',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D1620;--navy:#0A1F3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1620;--navy:#0A1F3A;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--body);display:flex;flex-direction:column}
.bar{background:var(--navy);color:var(--bar-fg);display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--bar-muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.tab{font:600 13px var(--body);color:var(--bar-fg);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.16)}
.tab[aria-selected="true"]{background:var(--tab-active);color:var(--tab-active-fg);border-color:var(--tab-active)}
.tab .new{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--cyan);padding:1px 6px;border-radius:4px;margin-left:6px}
.tab:focus-visible,.pdf:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pdf{font:600 13px var(--body);color:var(--navy);background:var(--cyan);color:#fff;text-decoration:none;padding:8px 14px;border-radius:6px;white-space:nowrap}
.pdf:hover{filter:brightness(1.1)}
iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}
@media (max-width:600px){.brand{width:100%}.tabs{order:2;width:100%}.pdf{order:3}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">WESTRIC<small>Reportes de performance</small></div>
  <nav class="tabs" role="tablist" aria-label="Período del reporte">
    <button class="tab" role="tab" id="tab-octubre" data-id="octubre">Octubre 2026<span class="new">Nuevo</span></button>
    <button class="tab" role="tab" id="tab-ago-sep" data-id="ago-sep">Agosto – Septiembre 2026</button>
    <button class="tab" role="tab" id="tab-jul-ago" data-id="jul-ago">Julio – Agosto 2026</button>
  </nav>
  <a class="pdf" id="pdf" href="pdf/westric-reporte-octubre-2026.pdf" target="_blank" rel="noopener">Descargar PDF</a>
</header>
<iframe id="view" title="Reporte" src="reportes/octubre-2026.html"></iframe>
<script>
const R={
  'octubre':{html:'reportes/octubre-2026.html',pdf:'pdf/westric-reporte-octubre-2026.pdf'},
  'ago-sep':{html:'reportes/ago-sep-2026.html',pdf:'pdf/westric-reporte-ago-sep-2026.pdf'},
  'jul-ago':{html:'reportes/jul-ago-2026.html',pdf:'pdf/westric-reporte-jul-ago-2026.pdf'}
};
const view=document.getElementById('view'),pdf=document.getElementById('pdf');
function show(id){
  if(!R[id]) id='octubre';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===id));
  if(!view.src.endsWith(R[id].html)) view.src=R[id].html;
  pdf.href=R[id].pdf;
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{location.hash=t.dataset.id;show(t.dataset.id)}));
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
